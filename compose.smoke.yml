# Solo pruebas: SMTP capturado localmente; no usar este archivo en producción.
services:
  frontend:
    ports:
      - "127.0.0.1:${SMOKE_HTTP_PORT:-18088}:8080"
  backend:
    environment:
      MAIL_SERVER: mailpit
      MAIL_PORT: "1025"
      MAIL_USE_TLS: "false"
      MAIL_USE_SSL: "false"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_DEFAULT_SENDER: pruebas@example.uy
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${SMOKE_MAIL_PORT:-18028}:8025"
    networks:
      - app
