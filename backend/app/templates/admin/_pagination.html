<nav class="pagination" aria-label="Paginación">
  <span>{{ pagination.total }} registros · Página {{ pagination.page }} de {{ pagination.pages or 1 }}</span>
  {% if pagination.has_prev %}<a href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.prev_num)) }}">Anterior</a>{% endif %}
  {% if pagination.has_next %}<a href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.next_num)) }}">Siguiente</a>{% endif %}
</nav>
