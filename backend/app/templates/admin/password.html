{% extends 'admin/base.html' %}
{% block title %}Mi contraseña{% endblock %}
{% block content %}<h1>Cambiar mi contraseña</h1><p class="subtitle">Usá al menos ocho caracteres, con letras y números.</p><form method="post" class="card detail stack narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Contraseña actual<input name="current_password" type="password" required autocomplete="current-password"></label><label>Nueva contraseña<input name="new_password" type="password" minlength="8" required autocomplete="new-password"></label><button>Actualizar contraseña</button></form>{% endblock %}
